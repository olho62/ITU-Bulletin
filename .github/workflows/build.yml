name: Build bulletin

# GitHub's clock is UTC, so each edition is scheduled at both its GMT and BST
# times. build.py checks the UK clock and only builds on the run that matches.
# Times sit a few minutes early because GitHub runs are often a little late.
on:
  schedule:
    - cron: "52 4,5,11,12 * * *"   # morning 06:00, afternoon 13:00
    - cron: "22 22,23 * * *"       # night 23:30
  workflow_dispatch:                # the "Run workflow" button
    inputs:
      edition:
        description: "Which edition to build now"
        type: choice
        options: [morning, afternoon, night]
        default: morning

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bulletin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the page
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EDITION: ${{ inputs.edition }}
        run: python build.py ${EDITION:+--edition "$EDITION"}

      - name: Save it to the repository
        id: save
        run: |
          git config user.name  "ITU Bulletin"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Bulletin $(TZ=Europe/London date '+%a %d %b %H:%M')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.save.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - if: steps.save.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - if: steps.save.outputs.changed == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
